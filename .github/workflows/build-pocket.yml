name: Pocket

# The Analogue Pocket port (src/openfpga). Invoked by the domain selector
# in build.yml; shared runtime changes still select this workflow.
#
# No game data is available here, so this builds what needs none: the RISC-V
# program for each game, the desktop test binaries, and the port's lint. The
# SD card tree and the texture and music packs are built from a reader's own
# data.win and are not made here.

on:
  workflow_call:

env:
  # The openfpgaOS SDK commit the port is built against. The build only reads it.
  SDK_REPOSITORY: openfpgaOS/openfpgaSDK
  SDK_REF: a408ddc12aed0dfaa4aa22c06af82f829db77126
  # Compile with the runner's own cross compiler: the SDK's container mounts
  # only the SDK, and the port lives outside it.
  USE_SDK_CONTAINER: "0"
  # Keep invocations sequential; parallelize translation units within each one.
  MAKEFLAGS: "-j2"
  # PC_CC is used only by host make recipes. Do not export CC: the snapshot
  # shell suite expects a single compiler executable and defaults to clang.
  PC_CC: "ccache cc"
  CCACHE_DIR: ${{ github.workspace }}/.ccache-pocket
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPILERCHECK: content

permissions:
  contents: read

jobs:
  build-pocket:
    name: Build (Analogue Pocket)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: butterscotch

      # Next to the repository, which is where src/openfpga/Makefile looks for it.
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SDK_REPOSITORY }}
          ref: ${{ env.SDK_REF }}
          path: openfpgaSDK

      - name: Install build tools
        id: tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache clang libclang-rt-18-dev gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf libsdl2-dev pkg-config
          riscv64-unknown-elf-gcc --version | head -1

      - name: Fingerprint the compilers
        id: toolchains
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil

          digest = hashlib.sha256()
          for command in ("cc", "riscv64-unknown-elf-gcc", "ccache"):
              digest.update(Path(shutil.which(command)).read_bytes())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"hash={digest.hexdigest()}\n")
          PY

      # Source/header/flag changes are validated by ccache. Raw object trees
      # are deliberately not restored: make's header checksum is not a full
      # compiler/SDK/flags fingerprint. Never skip checks on a cache hit.
      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: pocket-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.SDK_REF }}-${{ steps.toolchains.outputs.hash }}-${{ github.sha }}
          restore-keys: pocket-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.SDK_REF }}-${{ steps.toolchains.outputs.hash }}-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Build the RISC-V programs
        working-directory: butterscotch/src/openfpga
        run: |
          make CC="ccache riscv64-unknown-elf-gcc" elf
          make GAME=deltarune CC="ccache riscv64-unknown-elf-gcc" elf

      - name: Check the interpreter loop is in block RAM
        working-directory: butterscotch/src/openfpga
        run: |
          # OF_FAST_LOOP puts executeBytecodeInstructions in the app's uncached block RAM, below
          # the SDRAM the rest of the program is linked into.
          for game in undertale deltarune; do
            line=$(riscv64-unknown-elf-nm -S out/.obj/$game/app.elf | grep -E ' executeBytecodeInstructions(\..*)?$' || true)
            if [ -z "$line" ]; then
              echo "::error::executeBytecodeInstructions not found in $game's program"
              exit 1
            fi
            echo "$game: $line"
            address=$((0x$(echo "$line" | awk '{print $1}')))
            if [ "$address" -ge $((0x10000000)) ]; then
              echo "::error::executeBytecodeInstructions of $game is in SDRAM, not block RAM"
              exit 1
            fi
          done

      # Fixture WAD flags can invalidate the device object directories.
      - name: Preserve the checked Pocket programs for upload
        working-directory: butterscotch/src/openfpga
        run: |
          mkdir -p out/artifacts
          for game in undertale deltarune; do
            cp "out/.obj/$game/app.elf" "out/artifacts/$game.elf"
          done

      - name: Build the desktop test binaries
        working-directory: butterscotch/src/openfpga
        run: |
          make undertale_pc
          make GAME=deltarune deltarune_pc

      - name: Lint the port's own files
        working-directory: butterscotch/src/openfpga
        run: make lint

      - name: Check Pocket controller input and button prompts
        working-directory: butterscotch/src/openfpga
        run: |
          make gamepad-input-fixture button-prompts-fixture
          ./undertale_pc_gamepad_input_fixture
          ./undertale_pc_button_prompts_fixture
          make GAME=deltarune deltarune-button-prompts-fixture-build
          ./deltarune_pc_button_names_fixture

      - name: Check save-state regressions with sanitizers
        working-directory: butterscotch/src/openfpga
        env:
          SDK_ROOT: ${{ github.workspace }}/openfpgaSDK
          UBSAN_OPTIONS: halt_on_error=1
        run: make snapshot-tests

      - name: Check script profiler accounting and toggles
        working-directory: butterscotch/src/openfpga
        run: |
          make profiler-fixture WADS="16 17" PC_BIN=bs_pc PC_OBJ_DIR="$PWD/out/.obj/profiler-fixture"
          ./bs_pc_profiler_fixture
          make profiler-fixture WADS="16 17" PC_BIN=bs_pc_generic \
            PC_OBJ_DIR="$PWD/out/.obj/profiler-fixture-generic" PC_EXTRA_CFLAGS=-UOF_FAST_LOOP
          ./bs_pc_generic_profiler_fixture

      - name: Check builtin compatibility with sanitizers
        working-directory: butterscotch/src/openfpga
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          make builtin-compat-fixture WADS="16 17" PC_BIN=bs_pc_compat \
            PC_OBJ_DIR="$PWD/out/.obj/sanitized-undertale" \
            PC_EXTRA_CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize=alignment"
          ./bs_pc_compat_builtin_compat_fixture

      - name: Check deferred and physics callback context
        working-directory: butterscotch/src/openfpga
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          make call-later-fixture WADS="16 17" PC_BIN=bs_pc_callbacks \
            PC_OBJ_DIR="$PWD/out/.obj/sanitized-undertale" \
            PC_EXTRA_CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize=alignment"
          ./bs_pc_callbacks_call_later_fixture
          make physics-contact-fixture WADS="16 17" PC_BIN=bs_pc_callbacks \
            PC_OBJ_DIR="$PWD/out/.obj/sanitized-undertale" \
            PC_EXTRA_CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize=alignment"
          ./bs_pc_callbacks_physics_contact_fixture

      - name: Check clipped sprite pixels and texture bounds
        working-directory: butterscotch/src/openfpga
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          make sprite-clipping-fixture WADS="16 17" PC_BIN=bs_pc_clipping \
            PC_OBJ_DIR="$PWD/out/.obj/sanitized-undertale" \
            PC_EXTRA_CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize=alignment"
          ./bs_pc_clipping_sprite_clipping_fixture

      - name: Check font sampling and menu layout
        working-directory: butterscotch/src/openfpga
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          make font-sampling-fixture WADS="16 17" PC_BIN=bs_pc_fonts \
            PC_OBJ_DIR="$PWD/out/.obj/sanitized-undertale" \
            PC_EXTRA_CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize=alignment"
          ./bs_pc_fonts_font_sampling_fixture
          make menu-fixture WADS="16 17" PC_BIN=bs_pc_fonts \
            PC_OBJ_DIR="$PWD/out/.obj/sanitized-undertale" \
            PC_EXTRA_CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize=alignment"
          for font_height in 0 6 16 24; do
            ./bs_pc_fonts_menu_fixture "$font_height"
          done

      - name: Check shared battle speech and UI sampling
        working-directory: butterscotch/src/openfpga
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          for game in undertale deltarune; do
            make GAME="$game" battle-contrast-fixture WADS="16 17" PC_BIN="bs_pc_battle_$game" \
              PC_OBJ_DIR="$PWD/out/.obj/sanitized-$game" \
              PC_EXTRA_CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize=alignment"
            "./bs_pc_battle_${game}_battle_contrast_fixture"
          done

      - name: Report compiler cache statistics
        if: ${{ always() && steps.tools.outcome == 'success' }}
        run: ccache --show-stats

      - uses: actions/upload-artifact@v7
        with:
          name: butterscotch-pocket-programs
          path: |
            butterscotch/src/openfpga/out/artifacts/undertale.elf
            butterscotch/src/openfpga/out/artifacts/deltarune.elf
          if-no-files-found: error
